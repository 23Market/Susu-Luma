<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* Baseline the Artifact runtime normally injects. Kept here so the standalone build matches. */
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Susu Luma Master Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: fixed left rail + scrolling main; sticky section header; KPI tiles → tables with row actions, drawers, confirm modals, messaging & broadcast. */
  :root{
    --bg:#eef1f6; --surface:#ffffff; --surface-2:#f4f6fa; --surface-3:#eaeef4;
    --border:#d8dfea; --border-strong:#c3cddc;
    --fg:#172033; --fg-muted:#586074; --fg-faint:#8b95a8;
    --accent:#2f58d0; --accent-fg:#ffffff; --accent-weak:#e6ecfc; --accent-line:#b9c9f5;
    --good:#1c9a56; --good-weak:#e1f3ea; --warn:#b9760f; --warn-weak:#f9eed7; --crit:#cf3447; --crit-weak:#fbe3e6;
    --shadow:0 1px 2px rgba(23,32,51,.06),0 6px 18px rgba(23,32,51,.07);
    --shadow-lg:0 12px 40px rgba(23,32,51,.18);
    --ring:0 0 0 3px var(--accent-weak);
    --r:12px; --r-sm:8px;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
    --disp:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c1018; --surface:#141a26; --surface-2:#1a2130; --surface-3:#222b3c;
    --border:#28313f; --border-strong:#3a4556;
    --fg:#e9edf5; --fg-muted:#9aa5ba; --fg-faint:#687183;
    --accent:#6e93ff; --accent-fg:#0b1120; --accent-weak:#1a2742; --accent-line:#2f4268;
    --good:#36c07c; --good-weak:#102a1d; --warn:#e2a647; --warn-weak:#2e2410; --crit:#f0616f; --crit-weak:#331a20;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
    --shadow-lg:0 16px 48px rgba(0,0,0,.6);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0c1018; --surface:#141a26; --surface-2:#1a2130; --surface-3:#222b3c;
    --border:#28313f; --border-strong:#3a4556;
    --fg:#e9edf5; --fg-muted:#9aa5ba; --fg-faint:#687183;
    --accent:#6e93ff; --accent-fg:#0b1120; --accent-weak:#1a2742; --accent-line:#2f4268;
    --good:#36c07c; --good-weak:#102a1d; --warn:#e2a647; --warn-weak:#2e2410; --crit:#f0616f; --crit-weak:#331a20;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
    --shadow-lg:0 16px 48px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
  h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.15;text-wrap:balance}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  .mono{font-family:var(--mono)} .tnum{font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));gap:4px;z-index:40;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
  .brand .mark{width:30px;height:30px;flex:none}
  .brand b{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.02em}
  .brand span{display:block;font-size:10.5px;color:var(--fg-faint);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:-2px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--fg-muted);font-weight:500}
  .nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
  .nav button:hover{background:var(--surface-2);color:var(--fg)}
  .nav button[aria-current="true"]{background:var(--accent-weak);color:var(--accent);font-weight:600}
  .nav .count{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--surface-3);color:var(--fg-muted);padding:1px 7px;border-radius:20px}
  .nav button[aria-current="true"] .count{background:var(--accent);color:var(--accent-fg)}
  .nav .count.alert{background:var(--crit);color:#fff}
  .rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
  .whoami{font-size:12px;color:var(--fg-muted)} .whoami b{color:var(--fg);font-weight:600}

  main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
  .topbar .search{flex:1;min-width:0;max-width:420px;position:relative}
  .topbar .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--fg-faint);fill:none;stroke-width:1.8}
  .topbar .search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--fg);font-size:13px}
  .topbar .search input:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}
  .env-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-weak);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);padding:4px 10px;border-radius:20px;white-space:nowrap}
  .env-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--fg-muted)}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
  .icon-btn:hover{color:var(--fg);border-color:var(--border-strong)}
  select.role{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--fg);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px}
  select.role:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}

  .view{padding:22px 20px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1200px;width:100%}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .view-head h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
  .view-head p{margin:3px 0 0;color:var(--fg-muted);font-size:13px;max-width:62ch}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-faint);margin:26px 0 11px}
  .eyebrow:first-child{margin-top:0}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-width:0}
  .kpi .lab{font-size:12px;color:var(--fg-muted)}
  .kpi .val{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:11.5px;color:var(--fg-faint);font-family:var(--mono)} .kpi .sub b{font-weight:600}
  .kpi.alert{border-color:color-mix(in srgb,var(--crit) 35%,transparent)} .kpi.alert .val{color:var(--crit)}
  .up{color:var(--good)} .down{color:var(--crit)}

  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
  .panel-h h3{font-size:14px;font-weight:600} .panel-h .hint{font-size:11.5px;color:var(--fg-faint)}
  .panel-b{padding:14px 15px}

  .chart{width:100%;height:160px;display:block}
  .chart .grid-l{stroke:var(--border);stroke-width:1}
  .chart .area{fill:var(--accent-weak)} .chart .line{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .chart .dot{fill:var(--accent)} .chart text{fill:var(--fg-faint);font-size:10px;font-family:var(--mono)}
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar-row{display:grid;grid-template-columns:96px 1fr 54px;align-items:center;gap:10px;font-size:12.5px}
  .bar-track{height:9px;background:var(--surface-3);border-radius:20px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);border-radius:20px}
  .bar-row .n{font-family:var(--mono);text-align:right;color:var(--fg-muted)}

  .qlist{display:flex;flex-direction:column}
  .qrow{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border)}
  .qrow:last-child{border-bottom:0}
  .qrow .qi{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center}
  .qrow .qi svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
  .qrow .qt{min-width:0;flex:1} .qrow .qt b{font-weight:600;font-size:13px} .qrow .qt span{display:block;font-size:11.5px;color:var(--fg-muted)}
  .qrow .qn{font-family:var(--disp);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums} .qrow .go{color:var(--fg-faint);font-size:12px}
  .tone-crit{background:var(--crit-weak);color:var(--crit)} .tone-warn{background:var(--warn-weak);color:var(--warn)}
  .tone-good{background:var(--good-weak);color:var(--good)} .tone-acc{background:var(--accent-weak);color:var(--accent)}

  .feed{display:flex;flex-direction:column}
  .feed-row{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border);font-size:12.5px}
  .feed-row:last-child{border-bottom:0}
  .feed-row .sev{width:7px;flex:none;border-radius:20px;margin:2px 0}
  .sev-info{background:var(--fg-faint)} .sev-warn{background:var(--warn)} .sev-crit{background:var(--crit)}
  .feed-row .fb{min-width:0;flex:1} .feed-row .fb b{font-weight:600}
  .feed-row time{display:block;color:var(--fg-faint);font-family:var(--mono);font-size:11px;margin-top:1px}

  .svc{display:flex;flex-wrap:wrap;gap:8px;padding:14px 15px}
  .svc .chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;border:1px solid var(--border);border-radius:20px;padding:5px 11px;background:var(--surface-2)}
  .svc .chip i{width:7px;height:7px;border-radius:50%;background:var(--good);font-style:normal}
  .svc .chip.degraded i{background:var(--warn)} .svc .chip.down i{background:var(--crit)}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar input[type=search]{flex:1;min-width:150px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--fg);font-size:13px}
  .toolbar input[type=search]:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;color:var(--fg-muted);padding:6px 11px;border-radius:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
  .filt{font-family:var(--sans);font-size:12.5px;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 9px}
  .filt:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}

  .tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .tscroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
  thead th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
  td .ttl{font-weight:600;display:block;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td .meta{font-size:11.5px;color:var(--fg-faint);font-family:var(--mono)}
  .price{font-family:var(--mono);font-weight:600;white-space:nowrap}
  .selname{font-size:12.5px} .selname span{display:block;font-family:var(--mono);font-size:11px;color:var(--fg-faint)}
  .rowacts{display:flex;gap:6px;justify-content:flex-end}
  .empty{padding:40px 16px;text-align:center;color:var(--fg-faint);font-size:13px}
  .flagtag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin:1px 2px 1px 0;background:var(--warn-weak);color:var(--warn);white-space:nowrap}
  .flagtag.sus{background:var(--crit-weak);color:var(--crit)}
  .selcol{width:34px;text-align:center}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;text-transform:capitalize}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
  .st-active,.st-verified,.st-published,.st-delivered,.st-sent{color:var(--good);background:var(--good-weak)}
  .st-pending,.st-paused,.st-review,.st-open,.st-queued,.st-scheduled{color:var(--warn);background:var(--warn-weak)}
  .st-rejected,.st-removed,.st-suspended,.st-restricted,.st-failed{color:var(--crit);background:var(--crit-weak)}
  .st-sold,.st-expired,.st-archived,.st-none,.st-buyer,.st-dismissed,.st-draft{color:var(--fg-muted);background:var(--surface-3)}
  .promo{color:var(--accent);background:var(--accent-weak)} .promo::before{display:none}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--fg);padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600;white-space:nowrap}
  .btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)} .btn.pri:hover{filter:brightness(1.05);background:var(--accent)}
  .btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)} .btn.danger:hover{background:var(--crit-weak)}
  .btn.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)} .btn.good:hover{background:var(--good-weak)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn[data-lock]::after{content:"";width:11px;height:11px;margin-left:1px;background:currentColor;-webkit-mask:var(--lock) center/contain no-repeat;mask:var(--lock) center/contain no-repeat;--lock:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>');opacity:.6}

  .scrim{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:80;opacity:0;transition:opacity .18s;pointer-events:none}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:90;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
  .drawer.on{transform:none}
  .drawer-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;padding-top:max(16px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--border)}
  .drawer-h .hid{font-family:var(--mono);font-size:11.5px;color:var(--fg-faint)} .drawer-h h2{font-size:17px;font-weight:700;margin-top:3px}
  .drawer-b{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px;padding-right:max(18px,env(safe-area-inset-right,0px))}
  .drawer-f{padding:13px 18px;padding-bottom:max(13px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px}
  .closex{margin-left:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;color:var(--fg-muted);flex:none}
  .dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
  .dl dt{color:var(--fg-muted)} .dl dd{margin:0;text-align:right;font-weight:500}
  .sec-t{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:9px}
  .reveal{font-family:var(--mono);display:inline-flex;align-items:center;gap:8px}
  .reveal button{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-weak);border:0;border-radius:5px;padding:2px 7px}
  .minihist{display:flex;flex-direction:column;gap:7px}
  .minihist .mh{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm)}
  .minihist .mh .ttl{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .16s}
  .modal.on{opacity:1;pointer-events:auto}
  .modal .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);width:min(460px,100%);padding:20px;transform:translateY(8px);transition:transform .16s;max-height:90vh;overflow-y:auto}
  .modal.on .box{transform:none}
  .modal h3{font-size:17px;font-weight:700;margin-bottom:6px}
  .modal p{color:var(--fg-muted);font-size:13px;margin:0 0 14px}
  .modal label{display:block;font-size:12px;font-weight:600;color:var(--fg-muted);margin:0 0 5px}
  .modal select,.modal textarea,.modal input[type=text]{width:100%;font-family:var(--sans);font-size:13px;color:var(--fg);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:13px}
  .modal textarea{resize:vertical;min-height:62px}
  .modal select:focus,.modal textarea:focus,.modal input:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}
  .modal .acts{display:flex;gap:9px;justify-content:flex-end}
  .modal .warnbox{display:flex;gap:9px;background:var(--crit-weak);border:1px solid color-mix(in srgb,var(--crit) 25%,transparent);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;color:var(--crit);margin-bottom:14px}

  .toasts{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}

  /* nav groups */

  /* module shell */
  .modhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}

  .shell-empty .ei svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
  .shell-empty b{font-size:14px;font-weight:600}
  .shell-empty p{margin:0;font-size:12.5px;color:var(--fg-muted);max-width:46ch}
  .shell-empty code{font-family:var(--mono);font-size:11.5px;background:var(--surface-3);padding:2px 6px;border-radius:4px}
  .permlist{display:flex;flex-wrap:wrap;gap:5px}
  .permlist span{font-family:var(--mono);font-size:10.5px;background:var(--surface-2);border:1px solid var(--border);color:var(--fg-muted);padding:2px 7px;border-radius:4px}
  .apit{width:100%;border-collapse:collapse;font-size:12px;min-width:0}

  .apit tr:last-child td{border-bottom:0}
  .apit .m{font-family:var(--mono);font-weight:700;font-size:10.5px;color:var(--accent);white-space:nowrap}
  .apit .p{font-family:var(--mono);font-size:11px;word-break:break-all}
  .foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--fg-faint);font-family:var(--mono)}
  .foot .sp{flex:1}
  /* role matrix */
  .mx{width:100%;border-collapse:collapse;font-size:12px;min-width:620px}
  .mx th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
  .mx td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  .mx tbody tr:hover{background:var(--surface-2)}
  .mx .cap{font-weight:600}
  .mv{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
  .mv-yes{background:var(--good-weak);color:var(--good)} .mv-no{background:var(--surface-3);color:var(--fg-faint)}
  .mv-lim{background:var(--warn-weak);color:var(--warn)} .mv-gov{background:var(--accent-weak);color:var(--accent)}
  .menu-btn{display:none}
  @media (max-width:880px){
    .app{grid-template-columns:1fr}
    .rail{position:fixed;left:0;top:0;height:100%;width:258px;transform:translateX(-100%);transition:transform .22s;padding-top:max(14px,env(safe-area-inset-top,0px));z-index:95}
    .rail.on{transform:none;box-shadow:var(--shadow-lg)}
    .menu-btn{display:inline-flex}
    .grid-2{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,1fr)}
    .bc-grid{grid-template-columns:1fr} .readout{position:static}
    .inbox{grid-template-columns:1fr} .convlist{max-height:240px;border-right:0;border-bottom:1px solid var(--border)}
  }
  @media (max-width:520px){ .kpis{grid-template-columns:1fr 1fr} .topbar .search{order:3;flex-basis:100%;max-width:none} .delv{grid-template-columns:1fr 1fr} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<script>
"use strict";
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry(2311);
const pick=a=>a[Math.floor(rnd()*a.length)];
const ri=(lo,hi)=>lo+Math.floor(rnd()*(hi-lo+1));
const DAY=864e5, NOW=Date.parse("2026-10-21T07:00:00Z");

const CATS=[["veh","Vehicles"],["prop","Property"],["elec","Electronics"],["phones","Phones & Tablets"],["home","Home & Furniture"],["fashion","Fashion"],["services","Services"],["jobs","Jobs"]];
const CATNAME=Object.fromEntries(CATS);
const first=["Mohamed","Fatmata","Ibrahim","Aminata","Alusine","Isatu","Abu","Mariama","Santigie","Kadiatu","Alhaji","Haja","Sorie","Zainab","Foday","Yeabu","Osman","Memunatu","Sahr","Jebbeh"];
const last=["Kamara","Sesay","Bangura","Conteh","Koroma","Turay","Mansaray","Jalloh","Kargbo","Fofanah","Sankoh","Bah","Kanu","Dumbuya","Saidu","Momoh","Williams","Coker","Deen","Yansaneh"];
const areas=["Freetown — Aberdeen","Freetown — Lumley","Freetown — Hill Station","Freetown — Wellington","Waterloo","Bo","Kenema","Makeni","Koidu","Port Loko"];
const titlesBy={
 veh:["Toyota Corolla 2014, low mileage","Honda CR-V 2016 clean title","Mercedes C200 2012","Bajaj keke (tricycle) 2022","Toyota Hiace minibus","Nissan Almera 2015","Mahindra pickup 2019"],
 prop:["2-bedroom flat, Lumley","Self-contained room, Wilberforce","Land 50x100 at Waterloo","4-bedroom house, Hill Station","Shop space, Sani Abacha St","Compound for rent, Goderich"],
 elec:["HP EliteBook i5 8GB","Samsung 43\" smart TV","Hisense fridge 260L","Generator 3.5KVA Tiger","Solar inverter 2KW kit","Canon EOS 2000D","PlayStation 4 slim 500GB"],
 phones:["iPhone 13 128GB","Samsung A54 dual SIM","Tecno Camon 20","Infinix Note 30","iPad 9th gen 64GB","Redmi Note 12","iPhone 11 64GB"],
 home:["6-seater dining set","Queen bed + mattress","Office desk and chair","Gas cooker 4-burner","3-piece sofa set","Wardrobe, 3-door"],
 fashion:["Ankara gown, custom","Men's leather shoes UK9","Human hair wig 18\"","Nike Air Force 1 UK8","Designer handbag","Kids clothes bundle"],
 services:["Plumbing & tiling","Event catering, Freetown","Laptop & phone repair","Generator servicing","Interior painting","Web design for SMEs"],
 jobs:["Shop sales assistant","Experienced driver wanted","Hotel receptionist","Security guard (night)","Accountant, part-time","Tailor needed"]
};
const STAT=["active","active","active","pending","pending","paused","rejected","sold","expired","removed","archived"];
const reasonCodes=["Prohibited item","Duplicate listing","Misleading price","Wrong category","Suspected scam","Counterfeit goods","Incomplete details","Other"];
function mkName(){return pick(first)+" "+pick(last)}
function mask(s,kind){ if(kind==="email"){const[a,b]=s.split("@");return a[0]+"•••@"+b;} return s.replace(/(\+232 \d\d )\d\d\d(.*)/,"$1•••$2"); }
function initials(n){return n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}

let USERS=[], LISTINGS=[], REPORTS=[], CONVOS={}, CAMPAIGNS=[];
(function seed(){
  for(let i=0;i<46;i++){
    const nm=mkName(); const type=rnd()<.52?"seller":(rnd()<.2?"business":"buyer");
    const st=pick(["active","active","active","active","active","restricted","suspended","pending"]);
    const ver= type==="buyer"?"none":pick(["verified","verified","pending","none","rejected"]);
    const flags=[]; if(rnd()<.12)flags.push("impersonation"); if(rnd()<.18)flags.push("spam"); if(rnd()<.1)flags.push("repeat abuse");
    USERS.push({id:"USR-"+(40000+ri(100,999)*10+i),name:nm,type,status:st,verification:ver,
      joined:NOW-ri(2,520)*DAY, lastActive:NOW-ri(0,120)*DAY,
      email:nm.toLowerCase().replace(/[^a-z]/g,".")+"@"+pick(["gmail.com","yahoo.com","hotmail.com"]),
      phone:"+232 "+pick(["76","77","78","79","30","88","99"])+" "+ri(100,999)+" "+ri(100,999),
      area:pick(areas), reports:flags.length?ri(1,6):(rnd()<.2?ri(1,3):0), flags,
      consent:{inapp:true,push:rnd()<.85,sms:rnd()<.8,whatsapp:rnd()<.6,email:rnd()<.4}, marketingOptIn:rnd()<.72});
  }
  const sellers=USERS.filter(u=>u.type!=="buyer");
  let n=0;
  for(const[cid,]of CATS){ const arr=titlesBy[cid];
    for(let k=0;k<ri(6,9);k++){ const sel=pick(sellers); let status=pick(STAT);
      const fl=[]; if(rnd()<.14)fl.push("duplicate"); if(rnd()<.14)fl.push("misleading price"); if(rnd()<.1)fl.push("suspicious");
      if(fl.includes("suspicious")&&rnd()<.6)status="pending";
      const promoted= rnd()<.16?pick(["boost","featured","top"]):null;
      const base={veh:[9000,220000],prop:[1200,950000],elec:[350,14000],phones:[600,9500],home:[250,6500],fashion:[80,2200],services:[150,4000],jobs:[0,0]}[cid];
      const price= cid==="jobs"?0:ri(base[0],base[1]);
      LISTINGS.push({id:"LST-"+(10000+n++),title:pick(arr),cat:cid,sellerId:sel.id,sellerName:sel.name,
        price,status,promoted,flags:fl,reports:fl.length?ri(1,5):(rnd()<.15?1:0),
        created:NOW-ri(0,90)*DAY, views:ri(3,1400)});
    }
  }
  // reports inbox
  const rreasons=["Item never delivered","Off-platform payment demanded","Counterfeit / fake","Misleading price","Prohibited item","Spam / duplicate","Offensive content","Impersonation"];
  let rn=0;
  LISTINGS.filter(l=>l.reports>0).slice(0,14).forEach(l=>{
    REPORTS.push({id:"RPT-"+(5000+rn++),type:"listing",targetId:l.id,targetLabel:l.title,cat:l.cat,
      reason:l.flags.includes("suspicious")?"Off-platform payment demanded":pick(rreasons),
      reporter:mask(pick(USERS).email,"email"),created:NOW-ri(0,10)*DAY,status:"open",count:l.reports});
  });
  USERS.filter(u=>u.flags.includes("impersonation")).slice(0,4).forEach(u=>{
    REPORTS.push({id:"RPT-"+(5000+rn++),type:"user",targetId:u.id,targetLabel:u.name,cat:null,
      reason:"Impersonation",reporter:mask(pick(USERS).email,"email"),created:NOW-ri(0,8)*DAY,status:"open",count:ri(1,4)});
  });
  // seed a few 1:1 conversations
  const convSellers=sellers.slice(0,6);
  convSellers.forEach((s,i)=>{
    const msgs=[];
    if(i%2===0){msgs.push({from:"seller",body:"Hello admin, why was my listing paused? I don't understand.",at:NOW-ri(20,90)*6e4,channel:"in-app",state:"read"});}
    else{msgs.push({from:"system",body:'Your listing "'+(LISTINGS.find(l=>l.sellerId===s.id)||{title:"item"}).title+'" was approved and is now live.',at:NOW-ri(120,400)*6e4,channel:"in-app",state:"delivered"});
         msgs.push({from:"seller",body:"Thank you! How do I feature it?",at:NOW-ri(10,110)*6e4,channel:"in-app",state:"read"});}
    CONVOS[s.id]={sellerId:s.id,sellerName:s.name,unread:i%2===0?1:0,messages:msgs};
  });

function listingMatch(l){
  if(LF.status!=="all"&&l.status!==LF.status)return false;

  if(LF.flag==="promoted"&&!l.promoted)return false;
  if(["duplicate","misleading price","suspicious"].includes(LF.flag)&&!l.flags.includes(LF.flag))return false;
  if(LF.q){const h=(l.title+" "+l.sellerName+" "+l.id).toLowerCase();if(!h.includes(LF.q))return false;}

    if(BC.type==="buyers"&&u.type!=="buyer")return false;

    if(BC.status==="restricted"&&!(u.status==="restricted"||u.status==="suspended"))return false;
    if(BC.cat!=="all"){const has=LISTINGS.some(l=>l.sellerId===u.id&&l.cat===BC.cat&&l.status==="active");if(!has)return false;}

function drawReadout(){

function sendBroadcast(elig,reach,cost,needsApproval){
  const name=BC.name||"Untitled broadcast";
  if(!BC.body.trim()){toast("Add a message first","bad");return;}
  const channels=[...BC.channels];
  const scheduled=BC.schedule==="scheduled";
  const status= scheduled?"scheduled":needsApproval?"open":"delivered";
  const camp={id:"BC-"+ri(320,399),name,audience:audienceLabel(),channels,recipients:elig,status,at:Date.now(),by:ADMIN_NAME[role],cost,
    delivered:status==="delivered"?Math.round(elig*0.94):0,read:status==="delivered"?Math.round(elig*0.58):0,replied:status==="delivered"?Math.round(elig*0.04):0};
  CAMPAIGNS.unshift(camp);
  audit("broadcast.send",`${scheduled?"Scheduled":needsApproval?"Submitted for approval":"Broadcast"} "${name}" to ${elig} recipients`,"critical","");
  toast(scheduled?"Broadcast scheduled for 09:00":needsApproval?"Submitted for approval":`Broadcast sent to ${elig} recipients`+(cost?` · Le ${cost.toLocaleString()}`:""),"ok");
  BC.name="";BC.body="";drawBroadcast($("#mBody"));refreshCounts();
}

/* ---------- ACTIONS + MODAL ---------- */
const NEEDS_REASON={reject:1,remove:1,restrict:1,suspend:1,recategorize:1,feature:1,verify:1};
const DESTRUCTIVE={remove:1,suspend:1};
const ACTVERB={approve:"Approve listing",reject:"Reject listing",pause:"Pause listing",resume:"Resume listing",remove:"Remove listing",restore:"Restore listing",feature:"Promote listing",recategorize:"Recategorise listing",restrict:"Restrict account",suspend:"Suspend account",reinstate:"Reinstate account",verify:"Verification decision",case:"Open case"};
function doListingAction(act,id){const l=LISTINGS.find(x=>x.id===id);if(!l)return;const pm={approve:"listings.moderate",reject:"listings.moderate",pause:"listings.moderate",resume:"listings.moderate",remove:"listings.remove",restore:"listings.restore",feature:"listings.feature",recategorize:"listings.recategorize"};if(!can(pm[act])||!inScope(l.cat)){refuse(pm[act],`listing ${id}`);return;}openActionModal({kind:"listing",act,target:l,title:ACTVERB[act],label:`${l.id} — ${l.title}`});}
function doUserAction(act,id){const u=USERS.find(x=>x.id===id);if(!u)return;const pm={restrict:"users.restrict",suspend:"users.suspend",reinstate:"users.reinstate",verify:"users.verify",case:"users.cases"};if(!can(pm[act])){refuse(pm[act],`account ${id}`);return;}openActionModal({kind:"user",act,target:u,title:ACTVERB[act],label:`${u.id} — ${u.name}`});}
function refuse(perm,on){toast(`Refused: your role can't do that (${perm})`,"bad");audit("access.denied",`Refused ${perm} on ${on}`,"warn","Permission denied");}
function openActionModal(o){
  const needReason=NEEDS_REASON[o.act],destructive=DESTRUCTIVE[o.act];
  const catOpts=CATS.filter(([id])=>id!==o.target.cat).map(([id,nm])=>`<option value="${id}">${nm}</option>`).join("");
  const packOpts=`<option value="boost">Boost — Le 150</option><option value="featured">Featured — Le 450</option><option value="top">Top of category — Le 900</option>`;
  const field=o.act==="verify"?`<label>Decision</label><select id="mDecision"><option value="approve">Approve verification</option><option value="reject">Reject verification</option></select>`
    :o.act==="recategorize"?`<label>Move to category</label><select id="mCat">${catOpts}</select>`
    :o.act==="feature"?`<label>Promotion pack</label><select id="mPack">${packOpts}</select><label>Billing reference</label><select id="mReason"><option>BIL-${ri(20000,29999)}</option></select>`
    :needReason?`<label>Reason</label><select id="mReason">${reasonCodes.map(r=>`<option>${r}</option>`).join("")}</select>`:"";
  const noteField=(needReason||o.act==="case")?`<label>Note ${["reject","remove","suspend","verify"].includes(o.act)?"(required)":"(optional)"}</label><textarea id="mNote" placeholder="Context for the audit trail…"></textarea>`:"";
  const notifyLine=(o.kind==="listing"||["suspend","verify","restrict"].includes(o.act))?`<p style="font-size:12px;color:var(--fg-muted);margin:-4px 0 12px;display:flex;gap:6px;align-items:center"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>The seller will be notified automatically.</p>`:"";
  $("#modalBox").innerHTML=`<h3>${o.title}</h3><p class="mono" style="font-size:12.5px">${esc(o.label)}</p>${destructive?`<div class="warnbox"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><div>This is a destructive action${o.act==="suspend"?" and will pause the seller's live listings":""}. It is written to the audit log as critical.</div></div>`:""}${field}${noteField}${notifyLine}<div class="acts"><button class="btn" data-cancel>Cancel</button><button class="btn ${destructive?"danger":"pri"}" id="mConfirm">${destructive?"Confirm":"Apply"}</button></div>`;
  $("#modal").classList.add("on");$("#modal").setAttribute("aria-hidden","false");
  $("#mConfirm").onclick=()=>applyAction(o);$("#modalBox").querySelector("[data-cancel]").onclick=closeModal;
}
function closeModal(){$("#modal").classList.remove("on");$("#modal").setAttribute("aria-hidden","true");}
function applyAction(o){
  const reason=$("#mReason")?$("#mReason").value:"";const note=$("#mNote")?$("#mNote").value.trim():"";
  if(["reject","remove","suspend"].includes(o.act)&&!note){toast("A note is required for this action","bad");return;}
  const t=o.target;
  if(o.kind==="listing"){
    const map={approve:"active",reject:"rejected",pause:"paused",resume:"active",remove:"removed",restore:"pending"};
    if(o.act==="recategorize"){const nc=$("#mCat").value;const old=CATNAME[t.cat];t.cat=nc;audit("listing.recategorize",`Moved "${t.title}" from ${old} to ${CATNAME[nc]}`,"info",reason);toast("Listing recategorised","ok");}
    else if(o.act==="feature"){const pack=$("#mPack").value;t.promoted=pack;audit("listing.promote",`Promoted "${t.title}" (${pack})`,"info","");toast("Promotion applied","ok");}
    else{t.status=map[o.act];const sev=o.act==="remove"?"critical":(o.act==="reject"?"warn":"info");audit("listing."+o.act,`${o.act[0].toUpperCase()+o.act.slice(1)}ed "${t.title}"`,sev,reason);
      // auto-notice
      if(o.act==="approve")notifySeller(t.sellerId,t.sellerName,`Good news — your listing "${t.title}" is now live on Luma.`,["in-app","push"]),toast("Listing live · seller notified","ok");
      else if(o.act==="reject")notifySeller(t.sellerId,t.sellerName,`Your listing "${t.title}" was not approved. Reason: ${reason}. You can edit and resubmit.`,["in-app","push","sms"]),toast("Listing rejected · seller notified","ok");
      else if(o.act==="remove")notifySeller(t.sellerId,t.sellerName,`Your listing "${t.title}" has been removed. Reason: ${reason}.`,["in-app","sms"]),toast("Listing removed · seller notified","ok");
      else toast("Listing "+t.status,"ok");}
    drawListings();
  }else{
    if(o.act==="verify"){const dec=$("#mDecision").value;t.verification=dec==="approve"?"verified":"rejected";audit("user.verify",`${dec==="approve"?"Approved":"Rejected"} verification for ${t.name}`,"info",note);notifySeller(t.id,t.name,`Your seller verification was ${dec==="approve"?"approved":"rejected"}. ${note||""}`,["in-app","sms"]);toast("Verification "+t.verification+" · seller notified","ok");}
    else{const map={restrict:"restricted",suspend:"suspended",reinstate:"active"};t.status=map[o.act]||t.status;const sev=o.act==="suspend"?"critical":"warn";audit("user."+o.act,`${ACTVERB[o.act]} — ${t.name}`,o.act==="reinstate"?"info":sev,reason||note);
      if(o.act==="suspend")notifySeller(t.id,t.name,`Your Luma account has been suspended. Reason: ${note}. You may appeal in the app.`,["in-app","sms","email"]);
      if(o.act==="reinstate")notifySeller(t.id,t.name,`Your Luma account has been reinstated. Welcome back.`,["in-app","push"]);
      toast(ACTVERB[o.act]+" done"+(["suspend","reinstate"].includes(o.act)?" · seller notified":""),"ok");}
    drawUsers();
  }
  closeModal();
  if($("#drawer").classList.contains("on")){o.kind==="listing"?openListing(t.id):openUser(t.id);}
  refreshCounts();if(currentView==="overview")renderOverview();
}
function openReveal(id){const u=USERS.find(x=>x.id===id);if(!u)return;$("#modalBox").innerHTML=`<h3>Reveal contact details</h3><p>Revealing ${esc(u.name)}'s email and phone is logged with your name and the purpose you choose.</p><label>Purpose</label><select id="mPurpose"><option value="ticket">Support ticket</option><option value="fraud">Fraud investigation</option><option value="legal">Legal request</option><option value="recovery">Account recovery</option></select><div class="acts"><button class="btn" data-cancel>Cancel</button><button class="btn pri" id="mReveal">Reveal &amp; log</button></div>`;$("#modal").classList.add("on");$("#modal").setAttribute("aria-hidden","false");$("#modalBox").querySelector("[data-cancel]").onclick=closeModal;$("#mReveal").onclick=()=>{const p=$("#mPurpose").value;revealState[id]=p;audit("user.pii.reveal",`Revealed contact details for ${u.name}`,"warn",p);closeModal();openUser(id);toast("Details revealed — logged","ok");};}

/* bulk */
function openBulkModal(act){
  const ids=[...LSEL];const eligible=LISTINGS.filter(l=>ids.includes(l.id)&&inScope(l.cat));
  if(!eligible.length){toast("No selected listings are in your scope","bad");return;}
  const reasonSel=act!=="approve"?`<label>Reason</label><select id="mReason">${reasonCodes.map(r=>`<option>${r}</option>`).join("")}</select>`:"";
  $("#modalBox").innerHTML=`<h3>Bulk ${act} — ${eligible.length} listing${eligible.length>1?"s":""}</h3><p>${ids.length-eligible.length?`${ids.length-eligible.length} skipped (out of scope). `:""}One audit entry will record all of them. Sellers are notified.</p>${reasonSel}<div class="acts"><button class="btn" data-cancel>Cancel</button><button class="btn ${act==="remove"?"danger":"pri"}" id="mConfirm">${act[0].toUpperCase()+act.slice(1)} ${eligible.length}</button></div>`;
  $("#modal").classList.add("on");$("#modal").setAttribute("aria-hidden","false");$("#modalBox").querySelector("[data-cancel]").onclick=closeModal;
  $("#mConfirm").onclick=()=>{const reason=$("#mReason")?$("#mReason").value:"";const map={approve:"active",reject:"rejected",remove:"removed"};eligible.forEach(l=>{l.status=map[act];if(act==="approve")notifySeller(l.sellerId,l.sellerName,`Your listing "${l.title}" is now live on Luma.`,["in-app","push"]);else notifySeller(l.sellerId,l.sellerName,`Your listing "${l.title}" was ${act==="remove"?"removed":"rejected"}. Reason: ${reason}.`,["in-app","sms"]);});audit("listing.bulk",`Bulk ${act} of ${eligible.length} listings`,act==="remove"?"critical":"warn",reason);eligible.forEach(l=>LSEL.delete(l.id));closeModal();drawListings();refreshCounts();toast(`${eligible.length} listings ${map[act]} · sellers notified`,"ok");};
}

const ST_LABEL={demo:["Demo","sc-demo"],part:["Partial","sc-part"],api:["API pending","sc-api"],prop:["Proposed","sc-prop"]};

function buildNav(){
  const groups={};Object.entries(MODULES).forEach(([id,m])=>{(groups[m.g]=groups[m.g]||[]).push([id,m])});
  const cntId={listings:"cnt-listings",users:"cnt-users",reports:"cnt-reports",messaging:"cnt-msg"};
  $("#nav").innerHTML=[G1,G2,G3,G4].map(g=>`<div class="navgroup">${g}</div>`+groups[g].map(([id,m])=>{
    const st=ST_LABEL[m.st];
    return `<button data-view="${id}"><span class="nb"></span>${esc(m.label)}${cntId[id]?`<span class="count" id="${cntId[id]}"></span>`:`<span class="sc ${st[1]}">${st[0]}</span>`}</button>`;
  }).join("")).join("");
}

function renderModuleShell(id){
  const m=MODULES[id],v=$("#view-module"),st=ST_LABEL[m.st];
  const head=`<div class="view-head"><div>
    <div class="modhead"><span class="modcode">${m.code}</span><span class="chip-pri">${m.pri}</span><span class="chip-st ${st[1]}">${st[0]}</span></div>
    <h1>${esc(m.label)}</h1><p>${esc(m.blurb||"")}</p></div></div>`;
  if(!can(m.perm)){
    v.innerHTML=head+`<div class="panel"><div class="shell-empty"><div class="ei" style="background:var(--crit-weak);color:var(--crit)"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
      <b>Not available to your role</b><p>${PERMS[role].label} does not hold <code>${m.perm}</code>. UI visibility is not authorisation — the server validates every request.</p></div></div>`;
    return;
  }
  v.innerHTML=head+`
   <div class="eyebrow">Key figures</div>
   <div class="kpis">${(m.kpis||[]).map(k=>`<div class="kpi ghost"><div class="lab">${esc(k)}</div><div class="val">Not connected</div><div class="sub">awaiting Admin API</div></div>`).join("")}</div>
   <div class="eyebrow">Directory</div>
   <div class="shell-grid">
     <div class="tablewrap"><div class="tscroll"><table><thead><tr>${(m.cols||[]).map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody><tr><td colspan="${(m.cols||[]).length||1}">
       <div class="shell-empty"><div class="ei"><svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
       <b>No data source connected</b><p>This directory will list records from <code>${esc((m.api&&m.api[0]&&m.api[0][1])||"the Admin API")}</code> once the contract is approved and the endpoint is implemented. Columns above are the approved shape.</p></div>
     </td></tr></tbody></table></div>
     <div class="foot"><span>Showing 0 of 0</span><span class="sp"></span><span>Server-side pagination required</span></div></div>
     <div style="display:flex;flex-direction:column;gap:14px">
       <div class="panel"><div class="panel-h"><h3>Permissions</h3></div><div class="panel-b"><div class="permlist">${(m.perms||[]).map(p=>`<span>${esc(p)}</span>`).join("")}</div></div></div>
       <div class="panel"><div class="panel-h"><h3>Proposed API</h3><span class="hint">not yet implemented</span></div><div class="panel-b" style="padding:4px 8px"><table class="apit"><tbody>${(m.api||[]).map(([mt,p,d])=>`<tr><td class="m">${mt}</td><td><div class="p">${esc(p)}</div><div class="meta">${esc(d)}</div></td></tr>`).join("")}</tbody></table></div></div>
     </div>
   </div>`;
}

function mvClass(v){return v==="Yes"||v==="Full"?"mv-yes":(v==="No"||v==="No by default"?"mv-no":(v==="Governed"?"mv-gov":"mv-lim"))}
function renderSettings(){
  const st=ST_LABEL.demo;
  $("#view-module").innerHTML=`<div class="view-head"><div>
     <div class="modhead"><span class="modcode">Section 5</span><span class="chip-pri">P0</span><span class="chip-st ${st[1]}">${st[0]}</span></div>
     <h1>Settings &amp; permissions</h1><p>The six approved roles and their capabilities. Switch the “Viewing as” role in the sidebar to see the console enforce this matrix. These are proposed capability names, to be reconciled with the repository catalogue before implementation.</p></div></div>
   <div class="eyebrow">Role &amp; permission matrix</div>
   <div class="tablewrap"><div class="tscroll"><table class="mx"><thead><tr><th>Capability</th><th>Super Admin</th><th>Operations Lead</th><th>Trust &amp; Safety</th><th>Support</th><th>Finance</th><th>Analyst</th></tr></thead>
   <tbody>${MATRIX_CAPS.map(([cap,vals])=>`<tr><td class="cap">${esc(cap)}</td>${vals.map(v=>`<td><span class="mv ${mvClass(v)}">${esc(v)}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div>
   <div class="foot"><span>13 capabilities × 6 roles</span><span class="sp"></span><span>UI visibility is not authorisation</span></div></div>
   <div class="eyebrow">Implementation status key</div>
   <div class="panel"><div class="qlist">
     ${[["Demo","sc-demo","Works here on generated sample data."],["Partial","sc-part","Some functionality exists; the complete workflow does not."],["API pending","sc-api","Needs a backend endpoint or data contract."],["Proposed","sc-prop","Specified in the gap analysis, not yet built."]].map(([l,c,d])=>`<div class="qrow"><span class="chip-st ${c}">${l}</span><div class="qt" style="margin-left:4px"><span>${d}</span></div></div>`).join("")}
   </div></div>
   <div class="panel" style="margin-top:14px"><div class="panel-b" style="font-size:12.5px;color:var(--fg-muted)">A screen is never marked <b>Integrated</b> or <b>Production approved</b> merely because its interface renders. Demo data, local reference-server results and a successful frontend build are not production acceptance evidence.</div></div>`;
}

/* ---------- nav ---------- */
const LEGACY=["overview","listings","users","reports","messaging"];
let currentView="overview";
function show(view){
  if(!MODULES[view])view="overview";
  currentView=view;const m=MODULES[view];
  LEGACY.forEach(v=>{$("#view-"+v).hidden=true;});$("#view-module").hidden=true;
  $$("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===view));
  if(m.legacy){$("#view-"+m.legacy).hidden=false;
    if(m.legacy==="overview")renderOverview();else if(m.legacy==="listings")renderListings();
    else if(m.legacy==="users")renderUsers();else if(m.legacy==="reports")renderReports();else if(m.legacy==="messaging")renderMessaging();}
  else{$("#view-module").hidden=false;if(m.custom==="settings")renderSettings();else renderModuleShell(view);}
  try{history.replaceState(null,"","#"+view);}catch(e){}
  $("#rail").classList.remove("on");$("#scrim").classList.remove("on");window.scrollTo(0,0);
}
function refreshCounts(){const m=metrics();const set=(id,v,alert)=>{const el=$("#"+id);if(!el)return;el.textContent=v||"";el.className="count"+(alert&&v?" alert":"");};
  set("cnt-listings",m.pendingListings);set("cnt-users",m.verifyQueue);set("cnt-reports",m.openReports,1);set("cnt-msg",m.unread);}
function buildRoles(){$("#roleSel").innerHTML=Object.entries(PERMS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("");$("#roleSel").value=role;$("#who-name").textContent=ADMIN_NAME[role];}

document.addEventListener("click",e=>{
  const t=e.target;
  const navB=t.closest("#nav button");if(navB){show(navB.dataset.view);return;}
  if(t.closest("[data-close]")||t===$("#scrim")){closeDrawer();return;}
  const goto=t.closest("[data-goto]");if(goto){show(goto.dataset.goto);return;}
  const conv=t.closest("[data-conv]");if(conv){MSEL=conv.dataset.conv;drawInbox($("#mBody"));return;}
  const msg=t.closest("[data-msg]");if(msg&&!msg.disabled){closeDrawer();show("messaging");MSUB="inbox";if(!CONVOS[msg.dataset.msg]){const u=USERS.find(x=>x.id===msg.dataset.msg);CONVOS[u.id]={sellerId:u.id,sellerName:u.name,unread:0,messages:[]};}MSEL=msg.dataset.msg;$$("#mSeg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.s==="inbox"));drawMsgBody();return;}
  const approveC=t.closest("[data-approve]");if(approveC&&!approveC.disabled){const c=CAMPAIGNS.find(x=>x.id===approveC.dataset.approve);if(c){c.status="delivered";c.delivered=Math.round(c.recipients*0.94);c.read=Math.round(c.recipients*0.57);c.replied=Math.round(c.recipients*0.04);audit("broadcast.approve",`Approved & released "${c.name}"`,"critical","");drawCampaigns();toast("Broadcast approved & released","ok");}return;}
  const bulk=t.closest("[data-bulk]");if(bulk&&!bulk.disabled){const b=bulk.dataset.bulk;if(b==="clear"){LSEL.clear();drawListings();}else openBulkModal(b);return;}
  const rres=t.closest("[data-rresolve]");if(rres&&!rres.disabled){resolveReport(rres.dataset.rid,rres.dataset.rresolve);return;}
  const openL=t.closest("[data-open]");if(openL){openListing(openL.dataset.open);return;}
  const actB=t.closest("[data-act]");if(actB&&!actB.disabled){e.stopPropagation();doListingAction(actB.dataset.act,actB.dataset.id);return;}
  const uactB=t.closest("[data-uact]");if(uactB&&!uactB.disabled){doUserAction(uactB.dataset.uact,uactB.dataset.id);return;}
  const rev=t.closest("[data-reveal]");if(rev&&!rev.disabled){openReveal(rev.dataset.reveal);return;}
  const uo=t.closest("[data-uopen]");if(uo){openUser(uo.dataset.uopen);return;}
  const rowL=t.closest("#lBody tr[data-id]");if(rowL&&!t.closest(".rowacts")&&!t.closest(".selcol")){openListing(rowL.dataset.id);return;}
  const rowU=t.closest("#uBody tr[data-uid]");if(rowU&&!t.closest(".rowacts")){openUser(rowU.dataset.uid);return;}
});
document.addEventListener("change",e=>{const c=e.target.closest("[data-sel]");if(c){if(c.checked)LSEL.add(c.dataset.sel);else LSEL.delete(c.dataset.sel);renderBulkBar();const all=$("#lAll");if(all){const rows=LISTINGS.filter(listingMatch);all.checked=rows.length>0&&rows.every(r=>LSEL.has(r.id));}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer();}});

$("#roleSel").addEventListener("change",e=>{role=e.target.value;$("#who-name").textContent=ADMIN_NAME[role];toast("Now viewing as "+PERMS[role].label);const rb=$("#view-reports");rb&&(rb.dataset.built="");refreshCounts();if(currentView==="listings")drawListings();else if(currentView==="users")drawUsers();else if(currentView==="reports")renderReports();else if(currentView==="messaging")drawMsgBody();else if(currentView==="overview")renderOverview();else show(currentView);});
$("#menuBtn").addEventListener("click",()=>{$("#rail").classList.toggle("on");$("#scrim").classList.toggle("on");});
$("#globalSearch").addEventListener("input",e=>{const q=e.target.value;if(currentView==="listings"){LF.q=q.toLowerCase();$("#lSearch")&&($("#lSearch").value=q);drawListings();}else if(currentView==="users"){UF.q=q.toLowerCase();$("#uSearch")&&($("#uSearch").value=q);drawUsers();}});
$("#globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"&&currentView==="overview")show("listings");});

function setTheme(mode){try{document.documentElement.setAttribute("data-theme",mode);localStorage.setItem("luma-theme",mode);}catch(e){}updThemeIco();}
function updThemeIco(){const dark=matchMedia("(prefers-color-scheme:dark)").matches;const attr=document.documentElement.getAttribute("data-theme");const isDark=attr?attr==="dark":dark;$("#themeIco").innerHTML=isDark?'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>':'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';}
$("#themeBtn").addEventListener("click",()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");setTheme(cur==="dark"?"light":"dark");});
(function initTheme(){try{const s=localStorage.getItem("luma-theme");if(s)document.documentElement.setAttribute("data-theme",s);}catch(e){}updThemeIco();})();

buildRoles();buildNav();refreshCounts();
const h=(location.hash||"").replace("#","");
show(MODULES[h]?h:"overview");
</script>
