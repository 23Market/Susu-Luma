name: Flutter checks

# Cost controls (see docs/CI_COST_CONTROLS.md):
# - Runs on pull requests to ANY base branch (stacked PRs included) and on pushes to main only.
#   There is no separate branch-push trigger, so one commit is never built twice.
# - Skipped when a change touches only non-Flutter files (docs, database, web console, prototype).
# - A newer push to the same pull request cancels the older, now pointless, run.
# - A job that hangs is stopped after 10 minutes instead of the 6-hour default.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'supabase/**'
      - 'admin-web/**'
      - 'prototype/**'
      - 'scripts/local-db/**'
      - '**.md'
      - '.github/workflows/database-security.yml'
      - '.github/workflows/admin-web.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'supabase/**'
      - 'admin-web/**'
      - 'prototype/**'
      - 'scripts/local-db/**'
      - '**.md'
      - '.github/workflows/database-security.yml'
      - '.github/workflows/admin-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
