# TEMPORARY. Runs every Flutter check even when an earlier one fails, so one CI run shows all problems.
# Remove before this branch is merged. Only runs on pushes to this work branch.
name: scratch-diagnose
on:
  push:
    branches: [work/luma-chat-media-20261120]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: format (report only)
        continue-on-error: true
        run: |
          dart format lib test
          git diff -- lib test
      - name: analyze
        continue-on-error: true
        run: flutter analyze
      - name: test
        continue-on-error: true
        run: flutter test
      - name: resolved pubspec.lock
        run: cat pubspec.lock
