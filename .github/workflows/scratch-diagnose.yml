# TEMPORARY, integration branch only. Runs every Flutter check on the combined code even if one fails.
name: scratch-diagnose
on:
  push:
    branches: ['work/luma-phone-build-*']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: format (report only)
        continue-on-error: true
        run: |
          dart format lib test
          git diff -- lib test
      - name: analyze
        continue-on-error: true
        run: flutter analyze
      - name: test
        continue-on-error: true
        run: flutter test
      - name: pubspec.lock changes from pub get
        run: git diff --stat -- pubspec.lock || true
