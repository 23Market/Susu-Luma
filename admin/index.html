<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'self'">
<title>Susu Luma Master Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e93ff"/><stop offset="1" stop-color="#2f58d0"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><circle cx="16" cy="16" r="5.4" fill="#fff"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M16 3.5v4"/><path d="M16 24.5v4"/><path d="M3.5 16h4"/><path d="M24.5 16h4"/><path d="M7.2 7.2l2.8 2.8"/><path d="M22 22l2.8 2.8"/><path d="M24.8 7.2L22 10"/><path d="M10 22l-2.8 2.8"/></g></svg>
      <div><b>Susu Luma</b><span>Master Admin</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="whoami">Signed in as<br><b id="who-name">—</b></div>
      <label class="whoami" for="roleSel">Viewing as role</label>
      <select class="role" id="roleSel" aria-label="Active role"></select>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><input id="globalSearch" type="search" placeholder="Search listings, sellers, users, reports…" autocomplete="off"></div>
      <span class="env-pill" title="This console is running on generated sample data. No production system is connected.">Demo data</span>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle light / dark"><svg id="themeIco" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
    </div>
    <section class="view" id="view-overview"></section>
    <section class="view" id="view-listings" hidden></section>
    <section class="view" id="view-users" hidden></section>
    <section class="view" id="view-reports" hidden></section>
    <section class="view" id="view-messaging" hidden></section>
    <section class="view" id="view-module" hidden></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true"></aside>
<div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
<script src="modules.js"></script>
<script src="live.js"></script>
<script src="boot.js"></script>
</body>
</html>
